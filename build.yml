name: Build CoopKit

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build mod
        run: bash ./gradlew --no-daemon build

      - name: Save mod
        uses: actions/upload-artifact@v4
        with:
          name: CoopKit-1.2.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
